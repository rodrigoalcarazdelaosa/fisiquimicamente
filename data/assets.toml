# Browser JavaScript dependencies. Update the matching SRI when changing a pinned URL.
# version replaces %s in CDN URLs. Local paths refer to the vendored copy in assets/.
# content_source identifies script URLs in existing content for replacement during rendering.
# Provider-managed URLs have no fixed version. First-party code is versioned with Git.

[js.kaTeX]
  version = "0.19.1"
  url = "https://cdn.jsdelivr.net/npm/katex@%s/dist/katex.mjs"
  mhchem_url = "https://cdn.jsdelivr.net/npm/katex@%s/dist/contrib/mhchem.mjs"
