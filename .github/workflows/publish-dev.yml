name: Publicar vista previa en Cloudflare Pages

on:
  push:
    branches: [dev]

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository == 'rodrigoalcarazdelaosa/fisiquimicamente'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar Hugo Extended
        run: |
          version=$(cat .hvm)
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/${version}/hugo_extended_${version#v}_linux-amd64.deb" -o "$RUNNER_TEMP/hugo.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - name: Compilar la vista previa
        env:
          HUGOxLANGUAGESxESxBASEURL: https://dev.fisiquimicamente.com/
          HUGOxPARAMSxNOTES_TUTORxENABLED: "false"
          HUGOxPARAMSxPDF_EMBED_API_KEY: ${{ secrets.PDF_EMBED_API_KEY_ES }}
        run: |
          source get_last_commit_hash.sh
          hugo --minify
          printf '\n/*\n  X-Robots-Tag: noindex\n' >> public/es/_headers

      - name: Publicar la edición española de dev
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public/es --project-name fisiquimicamente --branch dev --commit-dirty=true
