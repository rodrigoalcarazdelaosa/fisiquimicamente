# SITE SETUP
# Guide: https://wowchemy.com/docs/getting-started/
# Documentation: https://wowchemy.com/docs/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance

appearance:
  theme_day: nord
  theme_night: nord
  font: garamond
  font_size: XL

# SEO

marketing:
  seo:
    site_type: Project
    local_business_type: ""
    org_name: "FisiQuímicamente"
    description: "Recursos de Física y Química, tutoriales y ciencia de actualidad."
    twitter: "fqmente"
  analytics:
    google_analytics: ""
    baidu_tongji: ""
  verification:
    google: ""
    baidu: ""

# Site header

header:
  navbar:
    enable: true
    align: l
    show_logo: true
    show_language: false
    show_day_night: true
    show_search: true
    show_translations: true
    highlight_active_link: false

# Site footer

footer:
  block: custom
  show_translations: true
  text: "&copy; 2020&ndash;{year} Rodrigo Alcaraz de la Osa"
# Localization

locale:
  date_format: "2006-01-02"
  time_format: "15:04"
  address_format: es

# Site features

seasonal:
  bats: false

features:
  syntax_highlighter:
    theme_light: nord
    theme_dark: nord
  math:
    enable: false
  privacy_pack: # IP anonymization for the optional Google Analytics integration.
    enable: false
  repository:
    url: "https://github.com/rodrigoalcarazdelaosa/fisiquimicamente"
    content_dir: content/es
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: "discord"
  search:
    provider: wowchemy
# Extensions

extensions:
  cms:
    branch: main
    local_backend: false

sharing_image: sharing.png
sharing_image_en: sharing-en.png
sharing_image_ca: sharing-ca.png

abstract_length: 135

pdf_embed_api_key:

# Tutor on individual notes pages. Leave endpoint empty until the Worker is ready.
notes_tutor:
  enabled: true
  endpoint: "https://fisiquimicamente-notes-tutor.fisiquimicamente.workers.dev/api/tutor"
