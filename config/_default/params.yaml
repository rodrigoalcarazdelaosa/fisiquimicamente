# SITE SETUP
# Guide: https://wowchemy.com/docs/getting-started/
# Documentation: https://wowchemy.com/docs/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance

appearance:
  theme_day: nord
  theme_night: nord
  font: garamond
  font_size: XL

# SEO

marketing:
  seo:
    site_type: Project
    local_business_type: ""
    org_name: "FisiQuímicamente"
    description: "Recursos de Física y Química, tutoriales y ciencia de actualidad."
    twitter: "fqmente"
  verification:
    google: ""
    baidu: ""

# Site header

header:
  navbar:
    enable: true
    align: l
    show_logo: true
    show_language: false
    show_day_night: true
    show_search: true
    show_translations: true
    highlight_active_link: false

# Site footer

footer:
  block: custom
  show_translations: true
  text: "&copy; 2020&ndash;{year} Rodrigo Alcaraz de la Osa"
# Localization

locale:
  date_format: "2006-01-02"
  time_format: "15:04"

# Site features

seasonal:
  bats: false

features:
  syntax_highlighter:
    theme_light: nord
    theme_dark: nord
  repository:
    url: "https://github.com/rodrigoalcarazdelaosa/fisiquimicamente"
    content_dir: content/es
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: "discord"
  search:
    provider: wowchemy
# Extensions

extensions:
  cms:
    branch: main
    local_backend: false

sharing_image: sharing.png
sharing_image_en: sharing-en.png
sharing_image_ca: sharing-ca.png

abstract_length: 135

pdf_embed_api_key:

# Tutor on individual notes pages. Leave endpoint empty until the Worker is ready.
notes_tutor:
  enabled: true
  endpoint: "https://fisiquimicamente-notes-tutor.fisiquimicamente.workers.dev/api/tutor"

security:
  noindex: false
  csp:
    policy: >-
      base-uri 'self'; object-src 'none'; frame-ancestors 'none';
      form-action 'self' https://formspree.io
    report_policy: >-
      default-src 'self';
      script-src 'self' {inline_hashes} 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com
      https://counterscale.fisiquimicamente.workers.dev https://platform.twitter.com https://platform.x.com
      https://documentcloud.adobe.com https://static.codepen.io https://s.imgur.com https://www.imgur.com
      https://cedec.intef.es;
      script-src-attr 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc=';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
      font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:;
      img-src 'self' https: data: blob:;
      media-src 'self' https: blob: data:;
      connect-src 'self' https://counterscale.fisiquimicamente.workers.dev
      https://fisiquimicamente-notes-tutor.fisiquimicamente.workers.dev https://cdn.jsdelivr.net
      https://www.gstatic.com https://documentcloud.adobe.com https://*.adobe.io;
      frame-src 'self' https://phet.colorado.edu https://player.vimeo.com https://giphy.com
      https://tenor.com https://view.genial.ly https://www.ivoox.com https://open.spotify.com
      https://www.youtube.com https://www.youtube-nocookie.com https://cedec.intef.es
      https://tabla-periodica-colabora-8dea0.web.app https://*.twitter.com https://*.x.com
      https://codepen.io https://imgur.com https://www.imgur.com https://documentcloud.adobe.com
      https://*.adobe.com blob:;
      worker-src 'self' blob:;
