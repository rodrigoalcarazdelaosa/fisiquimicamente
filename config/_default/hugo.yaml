# Configuration of Hugo
# Guide: https://wowchemy.com/docs/getting-started/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

title: FisiQuímicamente # Website name

############################
## PAGE OPTIONS
############################

cascade:
  share: true
  reading_time: true

############################
## LANGUAGE
############################

defaultContentLanguage: es
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## ADVANCED
############################

enableGitInfo: true
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]
permalinks:
  authors: "/autor/:slug/"
  tags: "/etiqueta/:slug/"
  categories: "/categoria/:slug/"
  post: "/blog/:year/:month/:day/:slug"
disableAliases: true
outputs:
  home: [HTML, RSS, JSON, WebAppManifest, headers, redirects]
  section: [HTML, RSS]
mediaTypes:
  text/netlify:
    delimiter: ''
    suffixes: ['']
outputFormats:
  headers:
    baseName: _headers
    isPlainText: true
    mediatype: text/netlify
    notAlternative: true
  redirects:
    baseName: _redirects
    isPlainText: true
    mediatype: text/netlify
    notAlternative: true
imaging:
  resampleFilter: lanczos
  anchor: smart
  avif:
    quality: 75
  jpeg:
    quality: 75
  webp:
    quality: 75
timeout: 100000
taxonomies:
  tag: tags
  category: categories
  author: authors
capitalizeListTitles: false
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
            - - $
              - $
      extras:
        # Enable subscript, superscript, and highlighting with ~,^, and == wrappers
        insert:
          enable: false
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
  highlight:
    lineNos: false
    lineNumbersInTable: false
    noClasses: false
    guessSyntax: true
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: title
      weight: 20
    - name: summary
      weight: 10
    - name: tags
      weight: 100
    - name: categories
      weight: 40
security:
  funcs:
    getenv: [^HUGO_, ^WC_]
sitemap:
  changefreq: weekly
minify:
  disableHTML: true
privacy:
  x:
    enableDNT: true
  vimeo:
    enableDNT: true
